# Single-package workspace so pnpm can apply allowBuilds.
# Not a multi-package monorepo — only this root package is published/built.
packages:
  - "."

allowBuilds:
  sharp: true
  unrs-resolver: true

# Security overrides — mirrored from package.json > pnpm > overrides.
# pnpm reads this key from pnpm-workspace.yaml in v10+; the package.json copy
# covers v9. Both are kept so a future install cannot silently drop the fixes.
overrides:
  "baseline-browser-mapping@>=2.0.0 <2.11.0": ">=2.11.0"
  "brace-expansion@<1.1.17": ">=1.1.17"
